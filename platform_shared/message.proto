syntax = "proto3";

package socket_message;

import "filesystem.proto";
import "api.proto";
import "animation.proto";

// Partial data types
message Vector { float x = 1; float y = 2; }
message I2CDevice { int32 address = 1; string part_number = 2; string name = 3; }

// Individual message data types
message IMUData {
    float x = 1;
    float y = 2;
    float z = 3;
    float heading = 4;
    float altitude = 5;
    float bmp_temp = 6;
    float pressure = 7;
}

// FEATURE DATA
message FeaturesDataResponse {
    string variant = 10;
    string firmware_built_target = 20;
    string firmware_name = 30;
    string firmware_version = 40;
    // Hex SHA-256 of the running image's ELF, as its app description holds it: tells two builds of a version apart.
    string firmware_elf_sha256 = 41;
    
    // Each sensor is active when it was detected and is not disabled in the peripheral settings.
    bool camera = 50;
    bool camera_detected = 51;
    bool imu = 60;
    bool imu_detected = 61;
    bool mag = 70;
    bool mag_detected = 71;
    bool bmp = 80;
    bool bmp_detected = 81;
    reserved 90;
    bool servo = 100;
    bool servo_detected = 101;
    bool gesture = 105;
    bool gesture_detected = 106;
    bool ws2812 = 110;
    bool mdns = 120;
    bool embed_www = 130;

    string device_id = 140;
    string robot_name = 150;
    string hostname = 160;
}

message FeaturesDataRequest { }

// The robot's mechanical design. A robot without one keeps its servos asleep until it is chosen.
enum KinematicsVariant {
    KINEMATICS_VARIANT_UNSET = 0;
    SPOTMICRO_ESP32 = 1;
    SPOTMICRO_ESP32_MINI = 2;
    SPOTMICRO_YERTLE = 3;
}

message RobotSettings {
    string name = 1;
    KinematicsVariant variant = 2;
}

message RobotNameUpdate { string name = 1; }

// Stored and switched to while the robot is deactivated (409 otherwise); the reply reports the new variant.
message RobotVariantUpdate { KinematicsVariant variant = 1; }

// SYSTEM INFORMATION

message SystemInformationRequest { }
message SystemInformationResponse {
    AnalyticsData analytics_data = 1;
    StaticSystemInformation static_system_information = 2;
}

message SystemRestart {}
message SystemReset {}

// A firmware update: the image goes in order, in chunks of at most 16 KB, into the app slot the robot does not run
// from; the finish validates it and makes it the one booted next, which SystemRestart then boots.
message OtaStart {
    uint32 size = 1;
}
message OtaChunk {
    uint32 index = 1;
    bytes data = 2;
}
message OtaFinish {}

// Animation clips (animation.proto): play and stop are requests, so a refusal says why; the status goes to subscribers.
message AnimationParam {
    animation.ParamId id = 1;
    float value = 2;
}
message AnimationPlay {
    string name = 1;
    repeated AnimationParam params = 2;
}
message AnimationStop {}
enum AnimationState {
    ANIM_IDLE = 0;
    ANIM_ENTRY = 1;
    ANIM_PLAYING = 2;
    ANIM_HOLD = 3;
    ANIM_EXIT = 4;
}
message AnimationStatus {
    string name = 1;
    AnimationState state = 2;
    float t = 3;              // seconds of clip time
    uint32 clamped_mask = 4;  // bit leg * 3 + joint of a foot the legs could not reach
}
message AnimationListRequest {}
message AnimationEntry {
    string name = 1;
    bool builtin = 2;  // shipped in the firmware, else a file in /littlefs/animations
    uint32 size = 3;
}
message AnimationList {
    repeated AnimationEntry animations = 1;
}
message AnimationValidate {
    string name = 1;
}
message AnimationReport {
    bool ok = 1;
    string error = 2;
    uint32 clamped_mask = 3;  // over the whole clip, sampled
    // What the app shows for a clip that loads: the robot's copy decides, built-in or uploaded.
    string description = 4;
    repeated animation.ParamSpec params = 5;
    float duration = 6;  // seconds of clip time, without the entry and exit blends
    bool loop = 7;
    bool hold_end = 8;
}

message CorrelationRequest {
    uint32 correlation_id = 1;
    oneof request {
        FeaturesDataRequest features_data_request = 10;
        I2CScanDataRequest i2c_scan_data_request = 20;
        IMUCalibrateExecute imu_calibrate_execute = 30;
        SystemInformationRequest system_information_request = 40;
        FSDeleteRequest fs_delete_request = 50;
        FSMkdirRequest fs_mkdir_request = 60;
        FSListRequest fs_list_request = 70;
        FSDownloadRequest fs_download_request = 80;
        FSUploadStart fs_upload_start = 100;
        FSCancelTransfer fs_cancel_transfer = 120;
        RobotNameUpdate robot_name_update = 130;
        RobotVariantUpdate robot_variant_update = 131;
        api.WifiSettingsRequest wifi_settings_request = 140;
        api.WifiSettings wifi_settings = 141;
        api.WifiStatusRequest wifi_status_request = 142;
        api.WifiScanStart wifi_scan_start = 143;
        api.WifiNetworksRequest wifi_networks_request = 144;
        api.APSettingsRequest ap_settings_request = 150;
        api.APSettings ap_settings = 151;
        api.APStatusRequest ap_status_request = 152;
        api.MDNSStatusRequest mdns_status_request = 160;
        api.MDNSQueryRequest mdns_query_request = 161;
        api.CameraSettingsRequest camera_settings_request = 170;
        api.CameraSettings camera_settings = 171;
        api.ServoSettingsRequest servo_settings_request = 180;
        api.ServoSettings servo_settings = 181;
        api.PeripheralSettingsRequest peripheral_settings_request = 190;
        api.PeripheralSettings peripheral_settings = 191;
        SystemRestart system_restart = 200;
        SystemReset system_reset = 201;
        OtaStart ota_start = 210;
        OtaChunk ota_chunk = 211;
        OtaFinish ota_finish = 212;
        AnimationListRequest animation_list_request = 220;
        AnimationValidate animation_validate = 221;
        AnimationPlay animation_play = 222;
        AnimationStop animation_stop = 223;
    }
}

message CorrelationResponse {
    uint32 correlation_id = 1;
    uint32 status_code = 2;
    // Why the robot refused the request; empty on success.
    string error_message = 3;
    oneof response {
        FeaturesDataResponse features_data_response = 10;
        I2CScanData i2c_scan_data = 20;
        IMUCalibrateData imu_calibrate_data = 30;
        SystemInformationResponse system_information_response = 40;
        FSDeleteResponse fs_delete_response = 50;
        FSMkdirResponse fs_mkdir_response = 60;
        FSListResponse fs_list_response = 70;
        FSUploadStartResponse fs_upload_start_response = 100;
        FSCancelTransferResponse fs_cancel_transfer_response = 120;
        api.WifiSettings wifi_settings = 140;
        api.WifiStatus wifi_status = 142;
        api.WifiNetworkList wifi_network_list = 144;
        api.APSettings ap_settings = 150;
        api.APStatus ap_status = 152;
        api.MDNSStatus mdns_status = 160;
        api.MDNSQueryResponse mdns_query_response = 161;
        api.CameraSettings camera_settings = 170;
        api.ServoSettings servo_settings = 180;
        api.PeripheralSettings peripheral_settings = 190;
        AnimationList animation_list = 220;
        AnimationReport animation_report = 221;
    }
}

enum ModesEnum {
    DEACTIVATED = 0;
    IDLE = 1;
    CALIBRATION = 2;
    REST = 3;
    STAND = 4;
    WALK = 5;
    ANIMATE = 6;  // playing a clip, entered by AnimationPlay and left when it ends; not picked as a mode
}

message StaticSystemInformation {
    string esp_platform = 1; 
    string firmware_version = 2; 
    uint32 cpu_freq_mhz = 3; 
    string cpu_type = 4; 
    int32 cpu_rev = 5; 
    uint32 cpu_cores = 6; 
    uint32 sketch_size = 7; 
    uint32 free_sketch_space = 8; 
    string sdk_version = 9; 
    reserved 10;
    reserved "arduino_version";
    uint32 flash_chip_size = 11; 
    uint32 flash_chip_speed = 12; 
    string cpu_reset_reason = 13; 
}

message IMUCalibrateData {
    bool success = 1;   // the robot was still and the gyro bias was taken
    bool levelled = 2;  // the tilt was folded into the IMU mounting
    float tilt_deg = 3; // the tilt the accelerometer showed; above 15 degrees it is not levelled
}

message IMUCalibrateExecute {}

message ModeData { ModesEnum mode = 1; }

message AnalyticsData {
    int32 max_alloc_heap = 1;
    int32 psram_size = 2;
    int32 free_psram = 3;
    int32 free_heap = 4;
    int32 total_heap = 5;
    int32 min_free_heap = 6;
    float core_temp = 7;
    int32 fs_total = 8;
    int32 fs_used = 9;
    int64 uptime = 10;
    int32 cpu0_usage = 11;
    int32 cpu1_usage = 12;
    int32 cpu_usage = 13;
}

message ServoPWMData {
    int32 servo_id = 1;
    uint32 servo_pwm = 2;
}

message ServoStateData {
    bool active = 1;
}

message AnglesData { repeated int32 angles = 1; }

message I2CScanData { repeated I2CDevice devices = 1; }

message I2CScanDataRequest {}

message RSSIData { int32 rssi = 1; }

message SonarData { string dummy_field = 1; }

message ControllerData {
    Vector left = 10; Vector right = 11; float height = 20; float speed = 21; float s1 = 22;
}

message SystemInformation {
    AnalyticsData analytics_data = 1; StaticSystemInformation static_system_information = 2;
}

enum WalkGaits {
    TROT = 0;
    CRAWL = 1;
}

message WalkGaitData {
    WalkGaits gait = 1;
}

message KinematicData {
    float omega = 1;
    float phi = 2;
    float psi = 3;
    float xm = 4;
    float ym = 5;
    float zm = 6;
}

message SubscribeNotification { int32 tag = 1; }

message UnsubscribeNotification {int32 tag = 1; }

message PingMsg {}

message PongMsg {}

// ===== SIM-TO-REAL TELEMETRY (robot -> recorder) =====
// Vectors are in the body frame: x forward, y left, z up. Times are esp_timer microseconds.

message ImuSample {
    uint64 t_us = 1;             // when the accelerometer and gyro were read
    repeated float accel = 2;    // m/s^2, specific force: +9.81 on z when level and still
    repeated float gyro = 3;     // rad/s
    repeated float mag = 4;      // microtesla
    uint64 mag_t_us = 5;
    repeated float gravity = 6;  // unit vector of gravity: (0, 0, -1) when level
    repeated float quat = 7;     // w, x, y, z: rotates body vectors into the world frame
    repeated float rpy = 8;      // rad, roll, pitch, yaw (ZYX)
    float temperature = 9;       // degrees Celsius
    uint32 valid = 10;           // bits: 1 accel, 2 gyro, 4 mag, 8 orientation, 16 yaw drifts
}

message TickSample {
    uint32 seq = 1;
    uint64 t_us = 2;             // tick start
    uint32 period_us = 3;        // since the previous tick start
    uint32 compute_us = 4;       // tick start to just before the servo write
    ImuSample imu = 5;           // the sample this tick used
    repeated float angles = 6;   // rad, servo space, after the servo controller's smoothing
    repeated float targets = 7;  // rad, servo space, the motion's angles before smoothing
    repeated uint32 pwm = 8;     // the 12 values written to the PCA9685
    uint32 servo_write_us = 9;
    bool servo_ok = 10;
    repeated float command = 11; // lx, ly, rx, ry, height, speed, s1, as the motion state used them
    uint32 command_age_us = 12;  // tick start minus command_rx_us; 0 before any command
    uint64 command_rx_us = 13;
    ModesEnum mode = 14;
    WalkGaits gait = 15;
    bool link_lost = 16;         // the dead-man stop is in force
}

message TelemetryBatch {
    uint32 batch_seq = 1;
    uint32 dropped_ticks = 2;    // ticks the ring had no room for, since boot
    repeated TickSample ticks = 3;
}

message TelemetryHeader {
    string firmware_version = 1;
    string build_target = 2;
    string variant = 3;          // empty while no variant is chosen
    string device_id = 4;
    string imu_driver = 5;       // "none" without an IMU
    uint32 imu_rate_hz = 6;
    uint32 mag_rate_hz = 7;      // 0 without a magnetometer
    uint32 control_rate_hz = 8;
    api.ServoSettings servo_settings = 9;
    api.ImuSettings imu_settings = 10;
    uint32 batch_ticks = 11;
    repeated float joint_direction = 12; // sign MotionService applies per joint
}

message TelemetryNetwork {
    uint64 t_us = 1;
    int32 rssi = 2;
    uint32 channel = 3;
    uint32 batches_sent = 4;
    uint32 batches_failed = 5;
    uint32 ticks_dropped = 6;
}

// WebSocket message wrapper
message Message {
    // Retired, and never to be reused while apps that knew them are out there: the IMU calibration (120,
    // 121), I2C scan (180, 181), peripheral settings (190, 191) and WiFi settings (240) now travel as
    // correlation requests; the controller input (140) and kinematics (200) had no receiver.
    reserved 120, 121, 140, 180, 181, 190, 191, 200, 240;
    reserved "imu_calibrate", "imu_calibrate_execute", "input", "i2c_scan", "i2c_scan_data_request";
    reserved "peripheral_settings", "peripheral_settings_data_request", "kinematic_data", "wifi_settings";
    oneof message {
        CorrelationRequest correlation_request = 10;
        CorrelationResponse correlation_response = 11;
        SubscribeNotification sub_notif = 20;
        UnsubscribeNotification unsub_notif = 21;
        PingMsg pingmsg = 30;
        PongMsg pongmsg = 31;
        // Streaming file transfer messages (fire-and-forget, no correlation)
        FSDownloadMetadata fs_download_metadata = 39;
        FSDownloadData fs_download_data = 40;
        FSDownloadComplete fs_download_complete = 41;
        FSUploadData fs_upload_data = 42;
        FSUploadComplete fs_upload_complete = 43;
        IMUData imu = 110;
        ModeData mode = 130;
        AnalyticsData analytics = 150;
        WalkGaitData walk_gait = 160;
        AnglesData angles = 170;
        ServoPWMData servo_pwm = 210;
        ServoStateData servo_state = 211;
        ControllerData controller_data = 250;
        RSSIData rssi = 260;
        // On every change of the station: an address got, or the network lost.
        api.WifiStatus wifi_status = 280;
        TelemetryHeader telemetry_header = 270;
        TelemetryBatch telemetry_batch = 271;
        TelemetryNetwork telemetry_network = 272;
        AnimationStatus animation_status = 292;
    }
}
