syntax = "proto3";

package api;

// =============================================================================
// AP (Access Point) Settings - shared data types
// =============================================================================

enum APProvisionMode {
    AP_MODE_ALWAYS = 0;
    AP_MODE_DISCONNECTED = 1;
    AP_MODE_NEVER = 2;
}

enum APNetworkStatus {
    AP_ACTIVE = 0;
    AP_INACTIVE = 1;
    AP_LINGERING = 2;
}

message APSettings {
    APProvisionMode provision_mode = 1;
    string ssid = 2;
    string password = 3;
    uint32 channel = 4;
    bool ssid_hidden = 5;
    uint32 max_clients = 6;
    uint32 local_ip = 7;
    uint32 gateway_ip = 8;
    uint32 subnet_mask = 9;
}

message APStatus {
    APNetworkStatus status = 1;
    uint32 ip_address = 2;
    string mac_address = 3;
    uint32 station_num = 4;
}

// Empty request types for GET-like operations
message APSettingsRequest {}
message APStatusRequest {}

// =============================================================================
// Servo Settings - shared data types
// =============================================================================

message Servo {
    float center_pwm = 1;
    float direction = 2;
    float center_angle = 3;
    float conversion = 4;
    string name = 5;
}

message ServoSettings {
    repeated Servo servos = 1; // max 12 servos
}

message ServoSettingsRequest {}

// =============================================================================
// WiFi STA Settings - shared data types
// =============================================================================

message WifiNetwork {
    string ssid = 1;
    string password = 2;
    bool static_ip_config = 3;
    uint32 local_ip = 4;
    uint32 gateway_ip = 5;
    uint32 subnet_mask = 6;
    uint32 dns_ip_1 = 7;
    uint32 dns_ip_2 = 8;
}

message WifiSettings {
    string hostname = 1;
    bool priority_rssi = 2;
    repeated WifiNetwork wifi_networks = 3; // max 5 networks
    uint32 selected_network = 4;
    // Fingerprint of the network from secrets.h last merged into wifi_networks; kept by the firmware.
    uint32 applied_secret = 5;
}

message WifiSettingsRequest {}
message WifiStatusRequest {}
message WifiScanStart {}
message WifiNetworksRequest {}

// WiFi scan result - single network found during scan
message WifiNetworkScan {
    int32 rssi = 1;
    string ssid = 2;
    string bssid = 3;
    uint32 channel = 4;
    uint32 encryption_type = 5;
}

// Response for /api/wifi/networks endpoint
message WifiNetworkList {
    repeated WifiNetworkScan networks = 1;
}

// Response for /api/wifi/sta/status endpoint
message WifiStatus {
    uint32 status = 1;
    uint32 local_ip = 2;
    string mac_address = 3;
    int32 rssi = 4;
    string ssid = 5;
    string bssid = 6;
    uint32 channel = 7;
    uint32 subnet_mask = 8;
    uint32 gateway_ip = 9;
    uint32 dns_ip_1 = 10;
    uint32 dns_ip_2 = 11;
}

// =============================================================================
// Camera Settings - shared data types
// =============================================================================

message CameraSettings {
    uint32 pixformat = 1;
    uint32 framesize = 2;       // 0-10
    uint32 quality = 3;         // 0-63
    int32 brightness = 4;       // -2 to 2
    int32 contrast = 5;         // -2 to 2
    int32 saturation = 6;       // -2 to 2
    int32 sharpness = 7;        // -2 to 2
    uint32 denoise = 8;
    uint32 gainceiling = 9;
    uint32 whitebal = 10;
    uint32 special_effect = 11; // 0-6
    uint32 wb_mode = 12;        // 0-4
    uint32 awb = 13;
    uint32 exposure_ctrl = 14;
    uint32 awb_gain = 15;
    uint32 gain_ctrl = 16;
    uint32 aec = 17;
    uint32 aec2 = 18;
    int32 ae_level = 19;        // -2 to 2
    uint32 aec_value = 20;      // 0-1200
    uint32 agc = 21;
    uint32 agc_gain = 22;       // 0-30
    uint32 bpc = 23;
    uint32 wpc = 24;
    uint32 raw_gma = 25;
    uint32 lenc = 26;
    uint32 hmirror = 27;
    uint32 vflip = 28;
    uint32 dcw = 29;
    uint32 colorbar = 30;
}

message CameraSettingsRequest {}

// =============================================================================
// mDNS Settings - shared data types
// =============================================================================

message MDNSTxtRecord {
    string key = 1;
    string value = 2;
}

message MDNSServiceDef {
    string service = 1;
    string protocol = 2;
    uint32 port = 3;
    repeated MDNSTxtRecord txt_records = 4;
}

message MDNSStatus {
    bool started = 1;
    string hostname = 2;
    string instance = 3;
    repeated MDNSServiceDef services = 4;
    reserved 5; // global_txt_records, until the services carried their own
}

message MDNSStatusRequest {}

message MDNSQueryRequest {
    string service = 1;
    string protocol = 2;
}

message MDNSQueryResult {
    string name = 1;
    string ip = 2;
    uint32 port = 3;
}

message MDNSQueryResponse {
    repeated MDNSQueryResult services = 1;
}

// =============================================================================
// Peripheral Settings - I2C configuration
// =============================================================================

message PinConfig {
    int32 pin = 1;
    string mode = 2;
    string type = 3;
    string role = 4;
}

// How the IMU sits in the robot and how its readings are fused. A settings file without it gets the defaults:
// identity rotations, no magnetometer correction, fusion gain 0.1.
message ImuSettings {
    repeated float mounting = 1;      // row-major 3x3 rotation, IMU chip frame to body frame
    repeated float mag_alignment = 2; // row-major 3x3 rotation, magnetometer chip frame to IMU chip frame
    repeated float mag_offset = 3;    // microtesla, hard-iron offset, subtracted first
    repeated float mag_soft_iron = 4; // row-major 3x3, applied after the offset
    float fusion_gain = 5;            // Madgwick beta
}

message PeripheralSettings {
    int32 sda = 1;
    int32 scl = 2;
    int32 frequency = 3;
    repeated PinConfig pins = 4;
    ImuSettings imu = 5;
}

message PeripheralSettingsRequest {}
