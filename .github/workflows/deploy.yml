name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app
    env:
      BASE_PATH: /SpotMicroESP32-Leika

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "./app/pnpm-lock.yaml"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - run: pnpm install
      - run: pnpm run build

      - name: Add web flasher with the latest release firmware
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=app/build/flash
          mkdir -p "$site/firmware"
          cp flasher/index.html "$site/"
          if tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName); then
            gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.bin' --dir "$site/firmware"
          else
            tag=none
          fi
          python3 flasher/generate_manifests.py "$site" "$tag"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: "sveltekit"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
