name: Simulation Tests

# The speed model is pinned to traces of the firmware's own motion headers: this regenerates the traces
# from the current firmware, so a change to the motion code runs these tests and fails them if they disagree.
on:
  push:
    branches: [master]
    paths:
      - "simulation/**"
      - "platform_shared/**"
      - "esp32/include/**"
      - "esp32/test/host/**"
      - "app/static/spot_micro.urdf.xacro"
      - "app/static/yertle.URDF"
      - "app/static/URDF/**"
      - ".github/workflows/simulation-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "simulation/**"
      - "platform_shared/**"
      - "esp32/include/**"
      - "esp32/test/host/**"
      - "app/static/spot_micro.urdf.xacro"
      - "app/static/yertle.URDF"
      - "app/static/URDF/**"
      - ".github/workflows/simulation-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./simulation
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "simulation/uv.lock"

      # No test imports torch; skipping it and its CUDA wheels saves gigabytes per run.
      - name: Install dependencies without torch
        run: >-
          uv sync --locked
          --no-install-package torch --no-install-package triton
          --no-install-package cuda-bindings --no-install-package cuda-pathfinder
          --no-install-package cuda-toolkit --no-install-package nvidia-cublas
          --no-install-package nvidia-cuda-cupti --no-install-package nvidia-cuda-nvrtc
          --no-install-package nvidia-cuda-runtime --no-install-package nvidia-cudnn-cu13
          --no-install-package nvidia-cufft --no-install-package nvidia-cufile
          --no-install-package nvidia-curand --no-install-package nvidia-cusolver
          --no-install-package nvidia-cusparse --no-install-package nvidia-cusparselt-cu13
          --no-install-package nvidia-nccl-cu13 --no-install-package nvidia-nvjitlink
          --no-install-package nvidia-nvshmem-cu13 --no-install-package nvidia-nvtx

      # --no-sync from here on: a plain uv run would install torch after all.
      - name: Generate the protocol classes the recording loader reads
        run: uv run --no-sync python gen_protos.py

      - name: Trace the firmware motion code
        run: |
          uv run --no-sync python ../esp32/scripts/compile_protos.py
          uv run --no-sync python ../esp32/test/host/export_firmware_traces.py

      - name: Run tests
        run: uv run --no-sync pytest -q
