name: Simulation Tests

on:
  push:
    branches: [master]
    paths:
      - "simulation/**"
      - "app/static/spot_micro.urdf.xacro"
      - "app/static/yertle.URDF"
      - "app/static/URDF/**"
      - ".github/workflows/simulation-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "simulation/**"
      - "app/static/spot_micro.urdf.xacro"
      - "app/static/yertle.URDF"
      - "app/static/URDF/**"
      - ".github/workflows/simulation-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./simulation
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "simulation/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
