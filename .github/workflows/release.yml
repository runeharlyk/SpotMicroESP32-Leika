name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/embedded-build.yml

  release:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*

      - name: Collect factory and app images
        run: |
          mkdir release
          for dir in firmware-*; do
            env="${dir#firmware-}"
            cp "$dir/firmware.factory.bin" "release/$env.factory.bin"
            cp "$dir/firmware.bin" "release/$env.bin"
          done
          ls -l release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.bin --repo "${{ github.repository }}" --generate-notes

      - name: Redeploy the web flasher from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master --repo "${{ github.repository }}"
