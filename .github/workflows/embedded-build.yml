name: PlatformIO CI

on:
  workflow_call:
  push:
    branches: [master]
    paths:
      - "esp32/**"
      - "platform_shared/**"
      - "app/**"
      - "boards/**"
      - "platformio.ini"
      - "sdkconfig.defaults*"
      - ".github/workflows/embedded-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "esp32/**"
      - "platform_shared/**"
      - "app/**"
      - "boards/**"
      - "platformio.ini"
      - "sdkconfig.defaults*"
      - ".github/workflows/embedded-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-camera, esp32dev, esp32-wroom-camera, seeed-xiao-esp32s3, esp32-p4]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-${{ matrix.env }}-

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "./app/pnpm-lock.yaml"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO and build script dependencies
        run: pip install --upgrade platformio protobuf grpcio-tools -r esp32/scripts/requirements.txt

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: error
