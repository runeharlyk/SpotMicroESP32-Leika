name: Firmware Host Tests

# Firmware code tested on the host. The web app's TypeScript port of the motion code is pinned to
# traces of the firmware's own headers: this regenerates them from the current firmware and tests the
# port against them, so a change to the motion code fails here instead of leaving the traces stale.
# The secrets check and the merge of secrets.h's network into the stored ones run here too.
on:
  push:
    branches: [master]
    paths:
      - "esp32/src/**"
      - "esp32/include/**"
      - "esp32/test/**"
      - "esp32/scripts/secrets_file.py"
      - "platform_shared/**"
      - "app/src/lib/simulation/firmware/**"
      - "app/tests/unit/firmware-motion.spec.ts"
      - ".github/workflows/firmware-port-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "esp32/src/**"
      - "esp32/include/**"
      - "esp32/test/**"
      - "esp32/scripts/secrets_file.py"
      - "platform_shared/**"
      - "app/src/lib/simulation/firmware/**"
      - "app/tests/unit/firmware-motion.spec.ts"
      - ".github/workflows/firmware-port-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate the nanopb headers the motion code includes, and the embedded animation clips
        run: |
          pip install protobuf grpcio-tools
          python esp32/scripts/compile_protos.py
          python esp32/scripts/pack_animations.py

      - name: Test the firmware headers and scripts on the host
        run: |
          pip install pytest
          pytest -q esp32/test/scripts esp32/test/host

      - name: Trace the firmware motion code
        run: python esp32/test/host/export_firmware_traces.py

      - uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "./app/pnpm-lock.yaml"

      - name: Test the port against the traces
        working-directory: ./app
        run: |
          pnpm install
          pnpm proto
          pnpm exec svelte-kit sync
          pnpm exec vitest run tests/unit/firmware-motion.spec.ts
