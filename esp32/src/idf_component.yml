dependencies:
  idf:
    version: ">=5.0.0"
    
  espressif/mdns:
    version: "^1.3.0"
    
  joltwallet/littlefs:
    version: "^1.14.0"
    
  espressif/esp-dsp:
    version: "^1.4.0"
    
  espressif/led_strip:
    version: "^2.5.0"
    
  espressif/esp32-camera:
    version: "^2.0.0"
    rules:
      - if: "idf_version >=5.0.0"
      - if: "target not in [esp32p4]"
      
  # The Bluetooth link, on the S3 boards, whose builds all enable NimBLE (sdkconfig.defaults.ble): the classic ESP32
  # boards have too little heap for it beside WiFi.
  # The P4 has no radio of its own: its BLE would run on the C6 through ESP-Hosted, which this firmware does not set up.
  h2zero/esp-nimble-cpp:
    version: "^2.5.0"
    rules:
      - if: "target in [esp32s3]"

  espressif/esp_wifi_remote:
    version: ">=0.3.0"
    rules:
      - if: "target in [esp32p4]"
      
  # 3.x adds "-include eh_host_port_master_config.h", which pioarduino's builder splits apart by
  # sorting the compile flags; the P4 code was written against the 2.x API.
  espressif/esp_hosted:
    version: "^2.12.0"
    rules:
      - if: "target in [esp32p4]"

  espressif/esp_cam_sensor:
    version: ">=0.5.0"
    rules:
      - if: "target in [esp32p4]"